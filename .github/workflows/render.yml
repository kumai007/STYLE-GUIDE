# Renders the HyperFrames video in the cloud and uploads the MP4 to Google Drive.
name: Render video

# Run on every push to main, and by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Time zone used in the output file name.
      TZ: Asia/Kolkata
      # Pinned HyperFrames version (same as package.json).
      HF: hyperframes@0.8.210

    steps:
      # 1. Get the project files.
      - name: Check out repo
        uses: actions/checkout@v4

      # 2. Install Node. HyperFrames needs Node 22 or newer (Node 20 is too old).
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install FFmpeg (video encoder) and the headless Chrome that HyperFrames uses.
      - name: Install FFmpeg and Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npx --yes "$HF" browser ensure

      # 4. Build the output name: <project name>_<date>_<time>.mp4
      - name: Make output file name
        run: |
          PROJECT=$(jq -r '.name // empty' meta.json 2>/dev/null)
          PROJECT=${PROJECT:-${{ github.event.repository.name }}}
          STAMP=$(date +%Y-%m-%d_%H-%M-%S)
          echo "OUT=renders/${PROJECT}_${STAMP}.mp4" >> "$GITHUB_ENV"

      # 5. Render. GitHub runners have no GPU, so --gpu is not used (default CPU encode).
      #    The step prints how long the render took.
      - name: Render with HyperFrames
        run: |
          mkdir -p renders
          START=$SECONDS
          npx --yes "$HF" render -o "$OUT"
          TOOK=$((SECONDS - START))
          echo "Render took ${TOOK}s ($((TOOK / 60))m $((TOOK % 60))s)"
          echo "Render took **${TOOK}s** → \`$OUT\`" >> "$GITHUB_STEP_SUMMARY"
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$OUT"

      # 6. Backup: keep the MP4 as a GitHub artifact for 7 days.
      - name: Upload MP4 as artifact
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.run_number }}
          path: ${{ env.OUT }}
          retention-days: 7

      # 7. Install rclone (pinned official .deb).
      - name: Install rclone
        run: |
          curl -fsSL -o /tmp/rclone.deb https://downloads.rclone.org/v1.76.0/rclone-v1.76.0-linux-amd64.deb
          sudo dpkg -i /tmp/rclone.deb

      # 8. Write the RCLONE_CONFIG secret to rclone's config path (only on this
      #    temporary machine; never printed, never committed), then copy the MP4.
      - name: Upload MP4 to Google Drive (gdrive:Renders)
        env:
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -z "$RCLONE_CONFIG_TEXT" ]; then
            echo "::error::Secret RCLONE_CONFIG is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_TEXT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone copy "$OUT" gdrive:Renders --stats-one-line -v
          rclone lsl gdrive:Renders --include "$(basename "$OUT")"
