<!doctype html>
<html lang="en" data-resolution="landscape"
  data-composition-variables='[{"id":"text","type":"string","label":"Names","default":"PHILLY & KEELY"},{"id":"frames","type":"number","label":"Length in frames (30 fps)","default":120},{"id":"fps","type":"number","label":"fps","default":30},{"id":"image","type":"string","label":"Portrait 1 (path or data URI)","default":""},{"id":"image2","type":"string","label":"Portrait 2 (optional; none = one wide panel)","default":""}]'>
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="assets/vendor/gsap-3.14.2.min.js"></script>
<link rel="stylesheet" href="compositions/case-cards/lib/cc.css" />
<style>
  @font-face { font-family: "VCR OSD Mono"; src: url("assets/case-cards/fonts/vcr-osd-mono.ttf") format("truetype"); font-weight: 400; }
  #stage { background: #000; }
  #body { align-items: center; }
  #row { margin-top: 50px; display: flex; gap: 40px; }
  .panel { height: 800px; border: 2px solid #E9E6E8; overflow: hidden; position: relative; }
  .panel img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; transform-origin: 50% 35%; }
  #names { margin-top: 44px; font-family: "VCR OSD Mono", monospace; font-size: 72px; line-height: 1; color: #fff; letter-spacing: 6px;
           text-shadow: 0 0 10px rgba(255,255,255,0.45); white-space: nowrap; }
  #vig { background: radial-gradient(ellipse 78% 72% at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.3) 100%); }
</style>
</head>
<body>
<div id="stage" data-composition-id="NocturnCouple" data-start="0" data-duration="4" data-fps="30" data-width="1920" data-height="1080">
  <div class="fit">
    <div id="body" class="af"><div id="row"></div><div id="names"></div></div>
    <div id="vig" class="af"></div>
  </div>
</div>
<script src="compositions/case-cards/lib/cc.js"></script>
<script>
  const P = CC.props({ text: "PHILLY & KEELY", frames: 120, fps: 30, image: "", image2: "" });
  const { tween, ease, fade, $ } = CC;
  $("names").textContent = P.text.toUpperCase();
  const imgs = [];
  [[P.image, P.image2 ? 640 : 1000], [P.image && P.image2, 640]].forEach(function (a, i) {
    if (!a[0]) return;
    const d = document.createElement("div"); d.className = "panel"; d.style.width = a[1] + "px";
    const im = document.createElement("img"); im.src = i ? P.image2 : P.image; d.appendChild(im); $("row").appendChild(d); imgs.push(im);
  });
  function render(f) {
    $("body").style.opacity = fade(f, P.frames, 0.4 * P.fps);
    const z = tween(f, [0, Math.max(P.frames - 1, 1)], [1, 1.08], ease.sine);
    imgs.forEach(function (im) { im.style.transform = "scale(" + z + ")"; });
  }
  CC.clock("NocturnCouple", P.fps, P.frames, render);
</script>
</body></html>
