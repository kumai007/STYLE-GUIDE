<!doctype html>
<html lang="en" data-resolution="landscape" data-composition-variables='[{"id": "text", "type": "string", "label": "Text", "default": "Three hours later"}, {"id": "accent", "type": "color", "label": "Accent", "default": "#C1121F"}, {"id": "y", "type": "number", "label": "Vertical position (0-1)", "default": 0.68, "min": 0, "max": 1, "step": 0.01}, {"id": "durationInFrames", "type": "number", "label": "Duration (frames @30fps)", "default": 45, "min": 2, "step": 1}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="../../assets/overlays/gsap.min.js"></script>
<link rel="stylesheet" href="lib/overlays.css" />
<style>
  #em-fill { justify-content: center; align-items: center; }
  #em-text { position: absolute; font-family: var(--display); font-size: 96px; color: var(--ink); border-bottom: 6px solid; padding-bottom: 6px; text-transform: uppercase; text-shadow: var(--shadow); }
</style>
</head>
<body>
<div id="root" data-composition-id="Emphasis" data-start="0" data-duration="1.5" data-width="1920" data-height="1080" data-fps="30">
  <div id="em-fill" class="fill"><div id="em-text" data-var-text="text">Three hours later</div></div>
</div>
<script src="lib/rm.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  RM.mount({
    id: "Emphasis", fps: 30, defaultFrames: 45,
    init: function (P) {
      $("em-text").textContent = P.text; $("em-text").style.borderBottomColor = P.accent;
      $("em-text").style.top = (P.y * 100) + "%";
    },
    apply: function (f, P, dur) {
      var o = RM.envelope(f, dur, 4, 8), e = RM.enter(f, 30, 0);
      $("em-fill").style.opacity = o;
      $("em-text").style.transform = "scale(" + (1.12 - e * 0.12) + ")";
    }
  });
</script>
</body>
</html>
