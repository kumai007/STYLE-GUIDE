<script>
  var P = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
  var prefix = P.prefix !== undefined ? P.prefix : "202", from = P.from !== undefined ? P.from : "5", to = P.to !== undefined ? P.to : "6";
  var FPS = 60, DUR = 120, SLICES = 10, STAGE_H = 550, SLICE_H = 55, R = GM.random;
  // FLICKER and BURSTS copied verbatim from templates/src/glitch/GlitchNumber.tsx
  var FLICKER = "5658665555" + "5655555556" + "9656636656" + "6666566";
  var BURSTS = [[3, 6, 0.45], [46, 55, 1], [57, 61, 0.4], [65, 79, 1], [81, 85, 0.55], [88, 92, 0.2]];

  var inner = document.getElementById("gn-inner"), channels = [];

      s.appendChild(t); ch.appendChild(s); sl.push({ s: s, d: d });

    var digit = frame < 47 ? from : frame > 83 ? to : tail(FLICKER[frame - 47]);
    var offsets = [];
    for (var i = 0; i < SLICES; i++) offsets.push(R("act-" + frame + "-" + i) < g * 0.55 ? (R("shift-" + frame + "-" + i) - 0.5) * 2 * 78 * g : 0);
    var num = document.getElementById("gn-num");

    channels.forEach(function (sl, ci) {

        o.d.style.translate = digitDx + "px 0px";

    noise.style.backgroundPosition = Math.floor(R("nx-" + frame) * 300) + "px " + Math.floor(R("ny-" + frame) * 300) + "px";
